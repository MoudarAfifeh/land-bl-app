# Phase 0: only what's needed to ship templates. NSIS/installer config comes in Phase 7.
appId: com.landbl.app
productName: Land BL
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
# better-sqlite3 ships N-API prebuilds (ABI-stable across Node and Electron), so nothing needs
# rebuilding; a node-gyp rebuild would also require Python + MSVC. Verify with `npm run check:native`.
npmRebuild: false
extraResources:
  - from: templates/
    to: templates/
    filter:
      - '**/*'
  - from: src/main/db/migrations/
    to: migrations/
    filter:
      - '**/*'
